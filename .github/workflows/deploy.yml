name: Deploy

# Continuous deployment to the self-hosted host behind nginx-director.
# Runs on the host's self-hosted runner (label: blittermib), which
# builds the image from this fork and (re)starts the container. The
# named data volume and ./import intake persist across deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-blittermib
  cancel-in-progress: false

# Deploy only reads the repo to build and (re)start the container locally
# on the self-hosted runner; it never writes back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, blittermib]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history + tags so `git describe` yields a real version
          # (e.g. v0.15.1-3-gf321e42) instead of the compose `dev` default.
          fetch-depth: 0
          # Deploy never pushes; don't leave the token in git config.
          persist-credentials: false

      - name: Build and start container
        run: |
          BLITTERMIB_VERSION="$(git describe --tags --always --dirty)"
          export BLITTERMIB_VERSION
          echo "Building blittermib ${BLITTERMIB_VERSION}"
          docker compose up -d --build

      - name: Smoke test (/readyz)
        # 120 x 5s = 10 min: a release that ships a schema migration can
        # hold the readiness gate closed for minutes on our ~2.1M-symbol
        # corpus (v0.17.0's one-time oid_node trie build took ~6 min).
        # A normal cache-validated boot is ready in ~25s.
        run: |
          for _ in $(seq 1 120); do
            if docker exec blittermib wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "blittermib is ready"
              exit 0
            fi
            sleep 5
          done
          echo "readyz did not come up within timeout" >&2
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=120 blittermib
